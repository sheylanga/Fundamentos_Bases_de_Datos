<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="crow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <marker id="triangle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0,1 9,5 0,9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1060" height="760" fill="#f8fafc" rx="14"/>

  <!-- Cliente (Abstract) -->
  <g transform="translate(40, 40)" filter="url(#shadow)">
    <rect width="240" height="175" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
    <rect width="240" height="42" fill="#f8fafc" rx="8"/>
    <text x="120" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-style="italic" fill="#64748b">&lt;&lt;abstract&gt;&gt;</text>
    <text x="120" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Cliente</text>
    <line x1="0" y1="42" x2="240" y2="42" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="62" font-family="monospace" font-size="11" fill="#334155">- idCliente: int</text>
    <text x="15" y="80" font-family="monospace" font-size="11" fill="#334155">- rfc: string</text>
    <text x="15" y="98" font-family="monospace" font-size="11" fill="#334155">- telefono: string</text>
    <text x="15" y="116" font-family="monospace" font-size="11" fill="#334155">- correo: string</text>
    <line x1="0" y1="126" x2="240" y2="126" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="146" font-family="monospace" font-size="11" fill="#0f766e">+ obtenerDatosContacto():</text>
    <text x="15" y="162" font-family="monospace" font-size="11" fill="#0f766e">  string</text>
  </g>

  <!-- ClienteParticular -->
  <g transform="translate(30, 310)" filter="url(#shadow)">
    <rect width="220" height="150" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
    <rect width="220" height="34" fill="#f8fafc" rx="8"/>
    <text x="110" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">ClienteParticular</text>
    <line x1="0" y1="34" x2="220" y2="34" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="54" font-family="monospace" font-size="11" fill="#334155">- nombre: string</text>
    <text x="15" y="72" font-family="monospace" font-size="11" fill="#334155">- apellidos: string</text>
    <text x="15" y="90" font-family="monospace" font-size="11" fill="#334155">- curp: string</text>
    <line x1="0" y1="102" x2="220" y2="102" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="122" font-family="monospace" font-size="11" fill="#0f766e">+ obtenerNombreCompleto():</text>
    <text x="15" y="138" font-family="monospace" font-size="11" fill="#0f766e">  string</text>
  </g>

  <!-- ClienteEmpresa -->
  <g transform="translate(280, 310)" filter="url(#shadow)">
    <rect width="220" height="135" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
    <rect width="220" height="34" fill="#f8fafc" rx="8"/>
    <text x="110" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">ClienteEmpresa</text>
    <line x1="0" y1="34" x2="220" y2="34" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="54" font-family="monospace" font-size="11" fill="#334155">- razonSocial: string</text>
    <text x="15" y="72" font-family="monospace" font-size="11" fill="#334155">- representanteLegal: string</text>
    <line x1="0" y1="84" x2="220" y2="84" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="104" font-family="monospace" font-size="11" fill="#0f766e">+ obtenerDatosFiscales():</text>
    <text x="15" y="120" font-family="monospace" font-size="11" fill="#0f766e">  string</text>
  </g>

  <!-- Empleado -->
  <g transform="translate(540, 40)" filter="url(#shadow)">
    <rect width="220" height="165" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
    <rect width="220" height="34" fill="#f8fafc" rx="8"/>
    <text x="110" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Empleado</text>
    <line x1="0" y1="34" x2="220" y2="34" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="54" font-family="monospace" font-size="11" fill="#334155">- idEmpleado: int</text>
    <text x="15" y="72" font-family="monospace" font-size="11" fill="#334155">- nombre: string</text>
    <text x="15" y="90" font-family="monospace" font-size="11" fill="#334155">- licenciaConducir: string</text>
    <text x="15" y="108" font-family="monospace" font-size="11" fill="#334155">- telefono: string</text>
    <line x1="0" y1="118" x2="220" y2="118" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="138" font-family="monospace" font-size="11" fill="#0f766e">+ asignarEntrega(contrato:</text>
    <text x="15" y="152" font-family="monospace" font-size="11" fill="#0f766e">  ContratoRenta): void</text>
  </g>

  <!-- Categoria -->
  <g transform="translate(800, 40)" filter="url(#shadow)">
    <rect width="200" height="110" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
    <rect width="200" height="34" fill="#f8fafc" rx="8"/>
    <text x="100" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Categoria</text>
    <line x1="0" y1="34" x2="200" y2="34" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="54" font-family="monospace" font-size="11" fill="#334155">- idCategoria: int</text>
    <text x="15" y="72" font-family="monospace" font-size="11" fill="#334155">- nombreCategoria: string</text>
    <text x="15" y="90" font-family="monospace" font-size="11" fill="#334155">- descripcion: string</text>
  </g>

  <!-- Articulo -->
  <g transform="translate(800, 240)" filter="url(#shadow)">
    <rect width="220" height="205" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
    <rect width="220" height="34" fill="#f8fafc" rx="8"/>
    <text x="110" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Articulo</text>
    <line x1="0" y1="34" x2="220" y2="34" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="54" font-family="monospace" font-size="11" fill="#334155">- idArticulo: int</text>
    <text x="15" y="72" font-family="monospace" font-size="11" fill="#334155">- nombre: string</text>
    <text x="15" y="90" font-family="monospace" font-size="11" fill="#334155">- precioRentaUnitario: decimal</text>
    <text x="15" y="108" font-family="monospace" font-size="11" fill="#334155">- stockTotal: int</text>
    <line x1="0" y1="118" x2="220" y2="118" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="136" font-family="monospace" font-size="10" fill="#0f766e">+ verificarDisponibilidad</text>
    <text x="15" y="150" font-family="monospace" font-size="10" fill="#0f766e">  (cantidad: int): bool</text>
    <text x="15" y="172" font-family="monospace" font-size="10" fill="#0f766e">+ descontarStock(cantidad:</text>
    <text x="15" y="186" font-family="monospace" font-size="10" fill="#0f766e">  int): void</text>
  </g>

  <!-- ContratoRenta -->
  <g transform="translate(530, 280)" filter="url(#shadow)">
    <rect width="230" height="240" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
    <rect width="230" height="34" fill="#f8fafc" rx="8"/>
    <text x="115" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">ContratoRenta</text>
    <line x1="0" y1="34" x2="230" y2="34" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="52" font-family="monospace" font-size="11" fill="#334155">- idContrato: int</text>
    <text x="15" y="68" font-family="monospace" font-size="11" fill="#334155">- folio: string</text>
    <text x="15" y="84" font-family="monospace" font-size="11" fill="#334155">- fechaEvento: DateTime</text>
    <text x="15" y="100" font-family="monospace" font-size="11" fill="#334155">- fechaDevolucion: DateTime</text>
    <text x="15" y="116" font-family="monospace" font-size="11" fill="#334155">- direccionEntrega: string</text>
    <text x="15" y="132" font-family="monospace" font-size="11" fill="#334155">- estado: string</text>
    <line x1="0" y1="142" x2="230" y2="142" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="162" font-family="monospace" font-size="11" fill="#0f766e">+ calcularMontoTotal():</text>
    <text x="15" y="178" font-family="monospace" font-size="11" fill="#0f766e">  decimal</text>
    <text x="15" y="200" font-family="monospace" font-size="11" fill="#0f766e">+ cancelarContrato(): bool</text>
  </g>

  <!-- DetalleContrato -->
  <g transform="translate(680, 580)" filter="url(#shadow)">
    <rect width="220" height="135" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
    <rect width="220" height="34" fill="#f8fafc" rx="8"/>
    <text x="110" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">DetalleContrato</text>
    <line x1="0" y1="34" x2="220" y2="34" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="52" font-family="monospace" font-size="11" fill="#334155">- idDetalle: int</text>
    <text x="15" y="68" font-family="monospace" font-size="11" fill="#334155">- cantidadRentada: int</text>
    <text x="15" y="84" font-family="monospace" font-size="11" fill="#334155">- precioPactado: decimal</text>
    <line x1="0" y1="94" x2="220" y2="94" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="114" font-family="monospace" font-size="11" fill="#0f766e">+ calcularSubtotal():</text>
    <text x="15" y="128" font-family="monospace" font-size="11" fill="#0f766e">  decimal</text>
  </g>

  <!-- UML Connectors -->
  <!-- Generalization 1: ClienteParticular -> Cliente -->
  <path d="M 140 310 V 240 H 120 V 215" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#triangle)"/>
  <text x="105" y="260" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Herencia</text>

  <!-- Generalization 2: ClienteEmpresa -> Cliente -->
  <path d="M 370 310 V 240 H 180 V 215" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#triangle)"/>
  <text x="250" y="235" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Herencia</text>

  <!-- Association: Cliente -> ContratoRenta -->
  <path d="M 280 120 H 470 V 360 H 530" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="290" y="115" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">1</text>
  <text x="475" y="240" font-family="system-ui, sans-serif" font-size="11" fill="#475569">solicita</text>
  <text x="505" y="355" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">0..*</text>

  <!-- Association: Empleado -> ContratoRenta -->
  <line x1="645" y1="205" x2="645" y2="280" stroke="#334155" stroke-width="1.5"/>
  <text x="655" y="225" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">1</text>
  <text x="655" y="245" font-family="system-ui, sans-serif" font-size="11" fill="#475569">gestiona</text>
  <text x="655" y="275" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">0..*</text>

  <!-- Association: Categoria -> Articulo -->
  <line x1="900" y1="150" x2="900" y2="240" stroke="#334155" stroke-width="1.5"/>
  <text x="910" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">1</text>
  <text x="910" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#475569">clasifica</text>
  <text x="910" y="235" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">0..*</text>

  <!-- Composition: ContratoRenta to DetalleContrato -->
  <!-- Diamond marker at ContratoRenta -->
  <polygon points="645,520 651,530 645,540 639,530" fill="#0f172a" stroke="#0f172a"/>
  <path d="M 645 540 V 640 H 680" fill="none" stroke="#334155" stroke-width="1.8"/>
  <text x="655" y="555" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">1</text>
  <text x="590" y="585" font-family="system-ui, sans-serif" font-size="11" fill="#475569">composición</text>
  <text x="650" y="635" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">1..*</text>

  <!-- Association: DetalleContrato -> Articulo -->
  <path d="M 900 640 H 940 V 445" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="905" y="635" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">0..*</text>
  <text x="945" y="540" font-family="system-ui, sans-serif" font-size="11" fill="#475569">referencia</text>
  <text x="945" y="460" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">1</text>

</svg>