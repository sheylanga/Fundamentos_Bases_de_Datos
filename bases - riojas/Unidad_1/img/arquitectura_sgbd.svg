<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 780" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="550" height="780" fill="#f8fafc" rx="14"/>

  <!-- TOP LEVEL: APLICACIONES / USUARIOS -->
  <g filter="url(#shadow)" transform="translate(160, 25)">
    <rect width="230" height="55" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <text x="115" y="33" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Aplicaciones / Usuarios</text>
  </g>

  <!-- Arrow down -->
  <line x1="275" y1="80" x2="275" y2="120" stroke="#1e293b" stroke-width="2"/>
  <polygon points="275,127 270,117 280,117" fill="#1e293b"/>

  <!-- BOUNDARY BOX: ARQUITECTURA INTERNA DEL SGBD -->
  <rect x="30" y="125" width="490" height="495" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="275" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e293b" letter-spacing="1">ARQUITECTURA INTERNA DEL SGBD</text>

  <!-- MODULE 1: INTERFAZ SGBD -->
  <g filter="url(#shadow)" transform="translate(165, 175)">
    <rect width="220" height="65" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Interfaz del SGBD</text>
    <text x="110" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#3b82f6">DML / DDL / Consultas SQL</text>
  </g>

  <!-- Branch left to Query Processor -->
  <path d="M 220 240 V 270 H 135 V 290" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="135,296 130,286 140,286" fill="#2563eb"/>

  <!-- Branch right to Transaction Manager -->
  <path d="M 330 240 V 270 H 415 V 390" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="415,396 410,386 420,386" fill="#2563eb"/>

  <!-- LEFT COLUMN: PROCESADOR & OPTIMIZADOR -->
  <g filter="url(#shadow)" transform="translate(50, 300)">
    <!-- Procesador -->
    <rect width="170" height="60" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="85" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1">Procesador</text>
    <text x="85" y="47" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1">de Consultas</text>
  </g>

  <!-- Arrow Procesador -> Optimizador -->
  <line x1="135" y1="360" x2="135" y2="400" stroke="#0284c7" stroke-width="2"/>
  <polygon points="135,406 130,396 140,396" fill="#0284c7"/>

  <g filter="url(#shadow)" transform="translate(50, 410)">
    <!-- Optimizador -->
    <rect width="170" height="60" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="85" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1">Optimizador</text>
    <text x="85" y="47" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1">de Consultas</text>
  </g>

  <!-- RIGHT COLUMN: GESTOR DE TRANSACCIONES -->
  <g filter="url(#shadow)" transform="translate(325, 400)">
    <rect width="180" height="75" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">Gestor de</text>
    <text x="90" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">Transacciones y</text>
    <text x="90" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">Concurrencia (ACID)</text>
  </g>

  <!-- Connectors to Storage Manager -->
  <path d="M 135 470 V 505 H 220 V 525" fill="none" stroke="#0284c7" stroke-width="2"/>
  <polygon points="220,531 215,521 225,521" fill="#0284c7"/>

  <path d="M 415 475 V 505 H 330 V 525" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="330,531 325,521 335,521" fill="#7c3aed"/>

  <!-- GESTOR DE ALMACENAMIENTO -->
  <g filter="url(#shadow)" transform="translate(175, 535)">
    <rect width="200" height="60" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="100" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#065f46">Gestor de</text>
    <text x="100" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#065f46">Almacenamiento</text>
  </g>

  <!-- Connectors out of boundary box to Disks -->
  <path d="M 230 595 V 635 H 145 V 655" fill="none" stroke="#059669" stroke-width="2"/>
  <polygon points="145,661 140,651 150,651" fill="#059669"/>

  <path d="M 320 595 V 635 H 405 V 655" fill="none" stroke="#059669" stroke-width="2"/>
  <polygon points="405,661 400,651 410,651" fill="#059669"/>

  <!-- DISK CYLINDERS (DATOS & ÍNDICES) -->
  <g filter="url(#shadow)" transform="translate(60, 665)">
    <path d="M 0 15 C 0 5 170 5 170 15 L 170 65 C 170 75 0 75 0 65 Z" fill="#f1f5f9" stroke="#334155" stroke-width="1.8"/>
    <ellipse cx="85" cy="15" rx="85" ry="10" fill="#e2e8f0" stroke="#334155" stroke-width="1.8"/>
    <text x="85" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Datos</text>
  </g>

  <g filter="url(#shadow)" transform="translate(320, 665)">
    <path d="M 0 15 C 0 5 170 5 170 15 L 170 65 C 170 75 0 75 0 65 Z" fill="#f1f5f9" stroke="#334155" stroke-width="1.8"/>
    <ellipse cx="85" cy="15" rx="85" ry="10" fill="#e2e8f0" stroke="#334155" stroke-width="1.8"/>
    <text x="85" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Índices y</text>
    <text x="85" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Metadatos</text>
  </g>
</svg>