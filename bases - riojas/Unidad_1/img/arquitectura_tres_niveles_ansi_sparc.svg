<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 680" width="100%" height="100%">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="650" height="680" fill="#f8fafc" rx="14"/>

  <!-- TITLE -->
  <text x="325" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0f172a">ARQUITECTURA DE TRES NIVELES (ANSI/SPARC)</text>
  <text x="325" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Principio fundamental de Independencia Lógica y Física de Datos</text>

  <!-- USERS -->
  <g filter="url(#boxShadow)">
    <!-- User 1 -->
    <rect x="50" y="85" width="140" height="42" rx="21" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="120" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Usuario 1</text>
    
    <!-- User 2 -->
    <rect x="255" y="85" width="140" height="42" rx="21" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="325" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Usuario 2</text>

    <!-- User N -->
    <rect x="460" y="85" width="140" height="42" rx="21" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="530" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Usuario N</text>
  </g>

  <!-- Arrows User -> Vista -->
  <line x1="120" y1="127" x2="120" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="325" y1="127" x2="325" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="127" x2="530" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VISTAS / NIVEL EXTERNO -->
  <g filter="url(#boxShadow)">
    <rect x="40" y="160" width="160" height="55" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="120" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1">Vista 1</text>
    <text x="120" y="201" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#075985">Nivel Externo</text>

    <rect x="245" y="160" width="160" height="55" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="325" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1">Vista 2</text>
    <text x="325" y="201" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#075985">Nivel Externo</text>

    <rect x="450" y="160" width="160" height="55" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="530" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1">Vista N</text>
    <text x="530" y="201" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#075985">Nivel Externo</text>
  </g>

  <!-- Connectors from External to Conceptual -->
  <path d="M 120 215 V 250 H 325" fill="none" stroke="#0284c7" stroke-width="2"/>
  <path d="M 325 215 V 260" fill="none" stroke="#0284c7" stroke-width="2"/>
  <path d="M 530 215 V 250 H 325" fill="none" stroke="#0284c7" stroke-width="2"/>

  <!-- NIVEL CONCEPTUAL (DIAMOND / CARD) -->
  <g filter="url(#boxShadow)" transform="translate(195, 270)">
    <polygon points="130,0 260,75 130,150 0,75" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="130" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#312e81">Esquema Conceptual</text>
    <text x="130" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4338ca">Nivel Conceptual</text>
  </g>

  <!-- Connector from Conceptual to Internal -->
  <line x1="325" y1="420" x2="325" y2="455" stroke="#4f46e5" stroke-width="2.5"/>
  <polygon points="325,462 320,452 330,452" fill="#4f46e5"/>

  <!-- NIVEL INTERNO (FÍSICO) -->
  <g filter="url(#boxShadow)" transform="translate(215, 465)">
    <rect width="220" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="110" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#065f46">Esquema Interno</text>
    <text x="110" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#047857">Nivel Físico</text>
  </g>

  <!-- Connector to Storage -->
  <line x1="325" y1="525" x2="325" y2="560" stroke="#059669" stroke-width="2.5"/>
  <polygon points="325,567 320,557 330,557" fill="#059669"/>

  <!-- ALMACENAMIENTO FÍSICO BD (CYLINDER) -->
  <g filter="url(#boxShadow)" transform="translate(225, 570)">
    <path d="M 0 20 C 0 5 200 5 200 20 L 200 65 C 200 80 0 80 0 65 Z" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <ellipse cx="100" cy="20" rx="100" ry="15" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <text x="100" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Almacenamiento Físico BD</text>
  </g>
</svg>